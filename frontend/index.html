<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campusen Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root {
    --navy: #0b1224;
    --navy-panel: #121b34;
    --navy-panel-light: #1a2542;
    --gold: #d9a441;
    --gold-soft: #f0c876;
    --green: #3fa66d;
    --text: #e8e9ee;
    --text-dim: #8992a8;
    --border: #263254;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at top, #101b36, var(--navy) 60%);
    color: var(--text);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 620px;
    height: 88vh;
    display: flex;
    flex-direction: column;
    background: var(--navy-panel);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }

  header {
    padding: 22px 24px;
    background: linear-gradient(135deg, #14203f, #0e1730);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .compass {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .compass svg { width: 20px; height: 20px; }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
    color: #fff;
    letter-spacing: 0.2px;
  }

  header p {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background:
      linear-gradient(var(--navy-panel), var(--navy-panel)) padding-box,
      repeating-linear-gradient(180deg, transparent 0 34px, rgba(217,164,65,0.05) 34px 35px) 0 0 / 100% 100%;
  }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg {
    padding: 12px 16px;
    border-radius: 14px;
    max-width: 82%;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14.5px;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    color: #1a1305;
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--navy-panel-light);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.loading {
    color: var(--text-dim);
    font-style: italic;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dots { display: inline-flex; gap: 3px; }
  .dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  .waypoints {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .waypoint {
    font-size: 11px;
    color: var(--green);
    background: rgba(63,166,109,0.12);
    border: 1px solid rgba(63,166,109,0.3);
    padding: 3px 9px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: var(--navy-panel-light);
    border-top: 1px solid var(--border);
  }

  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--navy);
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }

  input:focus {
    outline: none;
    border-color: var(--gold);
  }

  input::placeholder { color: var(--text-dim); }

  button {
    padding: 0 22px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold));
    color: #1a1305;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .msg.bot p { margin: 0 0 8px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul, .msg.bot ol { margin: 6px 0; padding-left: 20px; }
  .msg.bot li { margin-bottom: 4px; }
  .msg.bot strong { color: var(--gold-soft); }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="compass">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1305" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
      </svg>
    </div>
    <div>
      <h1>Campusen Assistant</h1>
      <p>Ton repère pour l'orientation post-bac</p>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="msg bot">Salut ! Je peux t'aider avec Campusen, les filières et les établissements. Pose ta question.</div>
  </div>

  <div class="chat-input-row">
    <input id="question-input" type="text" placeholder="Écris ta question..." autocomplete="off">
    <button type="button" id="send-btn">Envoyer</button>
  </div>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/ask-stream";

  const input = document.getElementById("question-input");
  const messagesDiv = document.getElementById("messages");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, role) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "bot") {
      div.innerHTML = marked.parse(text);
    } else {
      div.textContent = text;
    }
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendBtn.disabled = true;

    // On crée tout de suite la bulle de réponse, vide, qu'on va remplir au fur et à mesure
    const botDiv = addMessage("", "bot");
    let sources = [];
    let buffer = "";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });

      if (!response.ok) throw new Error("Erreur serveur : " + response.status);

      // reader permet de lire le flux (stream) morceau par morceau,
      // au lieu d'attendre que response.json() ait tout reçu
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const textChunk = decoder.decode(value, { stream: true });
        buffer += textChunk;

        // La première ligne contient les sources (voir event_generator côté serveur)
        if (buffer.startsWith("SOURCES:") && buffer.includes("\n")) {
          const newlineIndex = buffer.indexOf("\n");
          const sourcesLine = buffer.slice(8, newlineIndex);
          sources = JSON.parse(sourcesLine);
          buffer = buffer.slice(newlineIndex + 1);
        }

        botDiv.innerHTML = marked.parse(buffer);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      if (sources.length > 0) {
        const wrap = document.createElement("div");
        wrap.className = "waypoints";
        sources.forEach(src => {
          const tag = document.createElement(src.url ? "a" : "span");
          tag.className = "waypoint";
          tag.textContent = "📍 " + src.label;
          if (src.url) {
            tag.href = src.url;
            tag.target = "_blank";
            tag.rel = "noopener noreferrer";
            tag.style.textDecoration = "none";
          }
          wrap.appendChild(tag);
        });
        botDiv.appendChild(wrap);
      }

    } catch (error) {
      botDiv.textContent = "Erreur : impossible de contacter le serveur. Vérifie que l'API tourne bien (uvicorn).";
      console.error(error);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendQuestion);

  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      sendQuestion();
    }
  });
</script>

</body>
</html>
